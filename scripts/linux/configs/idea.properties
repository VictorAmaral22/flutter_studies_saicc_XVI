# Propriedades extras do Android Studio (laboratório)
# Concatenado/cópia em: $ANDROID_STUDIO_HOME/bin/idea.properties

# Não baixar updates automaticamente (economiza rede e CPU)
idea.is.internal=false
ide.no.platform.update=true

# Menos indexação agressiva em projetos grandes
idea.max.content.load.filesize=20000
idea.max.intellisense.filesize=2500

# Evita alguns popups de telemetria em ambientes compartilhados
# (o usuário ainda pode ver o wizard na 1ª abertura)
idea.plugins.compatible.build=
